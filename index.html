<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/mark-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080d18" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="Uyiz" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!--
      Everything between these markers is rewritten per page by
      scripts/prerender.mjs, and by src/seo/useSeoHead.ts once the app is
      running. Both build it from the same `buildHead()` call, so the head a
      crawler fetches and the head it renders after JavaScript can never
      disagree — which is what stops an SPA from looking like it is cloaking.

      The values here are the Uzbek home page's, so an unprerendered build
      (`vite build` on its own, or the dev server) is still correct at "/".
      They must stay byte-identical to `home.title` / `home.description` in
      src/seo/content/copy.uz.ts, or "/" describes itself differently
      depending on whether the prerenderer ran.

      The origin below is hard-coded because this file is not part of the
      module graph and cannot import src/seo/config.ts. The other two copies
      live in that file and in scripts/generate-sitemap.mjs; all three move
      together, and VITE_SITE_URL overrides the two that are code.
    -->
    <!--seo-head-start-->
    <title>Kvartira va uy ijarasi O‘zbekistonda | Uyiz.uz</title>
    <meta
      name="description"
      content="Uyiz — O‘zbekiston bo‘ylab kvartira, uy va xona ijarasi e’lonlari. Hudud, narx, xonalar soni va metro bekati bo‘yicha filtrlab, o‘zingizga mosini toping."
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="https://uyiz.uz/" />
    <link rel="alternate" hreflang="uz" href="https://uyiz.uz/" />
    <link rel="alternate" hreflang="ru" href="https://uyiz.uz/ru" />
    <link rel="alternate" hreflang="en" href="https://uyiz.uz/en" />
    <link rel="alternate" hreflang="x-default" href="https://uyiz.uz/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Uyiz" />
    <meta property="og:locale" content="uz_UZ" />
    <meta property="og:title" content="Kvartira va uy ijarasi O‘zbekistonda" />
    <meta
      property="og:description"
      content="O‘zbekiston bo‘ylab kvartira, uy va xona ijarasi e’lonlari. Hudud, narx va metro bekati bo‘yicha filtrlang."
    />
    <meta property="og:url" content="https://uyiz.uz/" />
    <!-- Absolute, because the Open Graph protocol requires it: a root-relative
         path leaves Telegram, WhatsApp and Slack with no preview image. -->
    <meta property="og:image" content="https://uyiz.uz/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kvartira va uy ijarasi O‘zbekistonda" />
    <meta
      name="twitter:description"
      content="O‘zbekiston bo‘ylab kvartira, uy va xona ijarasi e’lonlari. Hudud, narx va metro bekati bo‘yicha filtrlang."
    />
    <meta name="twitter:image" content="https://uyiz.uz/brand/og-image.png" />
    <!--seo-head-end-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--seo-preconnect-->

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    />

    <script>
      /*
       * Theme and language bootstrap — must run before first paint.
       *
       * Without this the page renders in light mode and then snaps to dark
       * once React mounts, which reads as a white flash on every load for
       * dark-mode users. Kept tiny and dependency-free on purpose.
       */
      (function () {
        /*
         * Reads a preference under its current key, adopting the pre-rebrand
         * one on the way. A returning visitor still has `maklersiz.*` in
         * storage; a bare rename would silently discard their saved theme and
         * language, so the old key is copied across and then removed. The
         * same shim lives in src/i18n/storage.ts for the app's own reads.
         */
        function readStored(key, legacyKey) {
          var value = localStorage.getItem(key);
          if (value !== null) return value;
          var legacy = localStorage.getItem(legacyKey);
          if (legacy === null) return null;
          localStorage.setItem(key, legacy);
          localStorage.removeItem(legacyKey);
          return legacy;
        }

        try {
          var stored = readStored('uyiz.theme', 'maklersiz.theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || ((!stored || stored === 'system') && prefersDark);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else if (stored === 'light') {
            /* Explicit light on a dark-mode OS: without this the class is
               already absent and looks handled, but colorScheme and the
               theme-color pair below still say dark. */
            document.documentElement.style.colorScheme = 'light';
          }
          /*
           * Both theme-color tags, not the first one.
           *
           * The pair above is media-scoped so a no-JavaScript load still
           * matches the OS. Once a choice has been read back, the OS is no
           * longer the answer — and writing to `querySelector`'s single hit
           * left the browser applying the *other* tag whenever the two
           * disagreed, which is every explicit choice that opposes the system
           * setting. Giving both the same colour makes whichever one the
           * media query selects the correct one.
           */
          if (stored === 'dark' || stored === 'light') {
            var metas = document.querySelectorAll('meta[name="theme-color"]');
            for (var i = 0; i < metas.length; i++) {
              metas[i].setAttribute('content', dark ? '#080d18' : '#f6f8fb');
            }
          }

          /*
           * The URL decides the language, and only falls back to the stored
           * choice when the address carries no prefix. Reading storage first
           * meant a visitor who had once picked Uzbek was served Uzbek at
           * /ru/toshkent — a page whose own canonical and hreflang tags said
           * it was Russian.
           */
          var path = location.pathname;
          var fromPath =
            path === '/ru' || path.indexOf('/ru/') === 0
              ? 'ru'
              : path === '/en' || path.indexOf('/en/') === 0
                ? 'en'
                : null;
          var lang = fromPath || readStored('uyiz.language', 'maklersiz.language');
          if (lang === 'uz' || lang === 'ru' || lang === 'en') {
            document.documentElement.lang = lang;
          }
        } catch (e) {
          /* private mode: fall back to the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--seo-body-start--><!--seo-body-end--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
