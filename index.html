<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/mark-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080d18" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="Maklersiz Uy" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!--
      Everything between these markers is rewritten per page by
      scripts/prerender.mjs, and by src/seo/useSeoHead.ts once the app is
      running. Both build it from the same `buildHead()` call, so the head a
      crawler fetches and the head it renders after JavaScript can never
      disagree — which is what stops an SPA from looking like it is cloaking.

      The values here are the Uzbek home page's, so an unprerendered build
      (`vite build` on its own, or the dev server) is still correct at "/".
    -->
    <!--seo-head-start-->
    <title>Maklersiz uy va kvartira ijarasi | Maklersizuy.uz</title>
    <meta
      name="description"
      content="Uy egasidan to‘g‘ridan-to‘g‘ri, maklersiz ijara. O‘zbekiston bo‘ylab tekshirilgan kvartira, uy va xona e’lonlari. Komissiya 0%."
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="https://maklersizuy.uz/" />
    <link rel="alternate" hreflang="uz" href="https://maklersizuy.uz/" />
    <link rel="alternate" hreflang="ru" href="https://maklersizuy.uz/ru" />
    <link rel="alternate" hreflang="en" href="https://maklersizuy.uz/en" />
    <link rel="alternate" hreflang="x-default" href="https://maklersizuy.uz/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Maklersiz Uy" />
    <meta property="og:locale" content="uz_UZ" />
    <meta property="og:title" content="Maklersiz uy va kvartira ijarasi" />
    <meta
      property="og:description"
      content="Uy egasidan to‘g‘ridan-to‘g‘ri, maklersiz ijara. Komissiya 0%."
    />
    <meta property="og:url" content="https://maklersizuy.uz/" />
    <!-- Absolute, because the Open Graph protocol requires it: a root-relative
         path leaves Telegram, WhatsApp and Slack with no preview image. -->
    <meta property="og:image" content="https://maklersizuy.uz/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Maklersiz uy va kvartira ijarasi" />
    <meta
      name="twitter:description"
      content="Uy egasidan to‘g‘ridan-to‘g‘ri, maklersiz ijara. Komissiya 0%."
    />
    <meta name="twitter:image" content="https://maklersizuy.uz/brand/og-image.png" />
    <!--seo-head-end-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--seo-preconnect-->

    <!--
      The font stylesheet is fetched at high priority but does not block the
      first paint: `media="print"` makes it non-render-blocking, and the load
      handler promotes it once it has arrived. Nine faces from a third-party
      origin used to sit directly in front of every visitor's first paint.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <script>
      /*
       * Theme and language bootstrap — must run before first paint.
       *
       * Without this the page renders in light mode and then snaps to dark
       * once React mounts, which reads as a white flash on every load for
       * dark-mode users. Kept tiny and dependency-free on purpose.
       */
      (function () {
        try {
          var stored = localStorage.getItem('maklersiz.theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || ((!stored || stored === 'system') && prefersDark);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#080d18');
          }

          /*
           * The URL decides the language, and only falls back to the stored
           * choice when the address carries no prefix. Reading storage first
           * meant a visitor who had once picked Uzbek was served Uzbek at
           * /ru/toshkent — a page whose own canonical and hreflang tags said
           * it was Russian.
           */
          var path = location.pathname;
          var fromPath =
            path === '/ru' || path.indexOf('/ru/') === 0
              ? 'ru'
              : path === '/en' || path.indexOf('/en/') === 0
                ? 'en'
                : null;
          var lang = fromPath || localStorage.getItem('maklersiz.language');
          if (lang === 'uz' || lang === 'ru' || lang === 'en') {
            document.documentElement.lang = lang;
          }
        } catch (e) {
          /* private mode: fall back to the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--seo-body-start--><!--seo-body-end--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
