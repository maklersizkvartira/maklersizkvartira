<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="40" height="40" rx="12" fill="#7000FF"/>
  <!-- Uzum Grape Bunches Pattern -->
  <g fill="white">
    <!-- Top row -->
    <circle cx="14" cy="14" r="3.2"/>
    <circle cx="20" cy="12" r="3.2"/>
    <circle cx="26" cy="14" r="3.2"/>
    <!-- Middle row -->
    <circle cx="17" cy="19.5" r="3.2"/>
    <circle cx="23" cy="19.5" r="3.2"/>
    <!-- Lower middle -->
    <circle cx="20" cy="25" r="3.2"/>
    <!-- Bottom -->
    <circle cx="20" cy="30" r="2.2"/>
  </g>
</svg>
