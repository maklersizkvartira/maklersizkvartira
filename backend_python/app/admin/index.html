<!DOCTYPE html>
<html lang="uz" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Maklersiz CRM</title>
    <link rel="icon" href="/admin/assets/brand/favicon.ico" />
    <link rel="stylesheet" href="/admin/assets/styles.css" />
    <script>
      /* Theme before first paint, so the panel does not flash white. */
      (function () {
        try {
          var stored = localStorage.getItem('maklersiz.admin.theme');
          var dark =
            stored === 'dark' ||
            (!stored &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- ================================================================== -->
    <!-- Login                                                              -->
    <!-- ================================================================== -->
    <div id="loginScreen" class="login-screen hidden">
      <div class="login-card">
        <div class="login-brand">
          <img src="/admin/assets/brand/mark-128.png" alt="" width="48" height="48" />
          <span class="name">Maklersiz <span class="brand-chip">Uy</span></span>
        </div>
        <h1 data-i18n="login.title">Admin panelga kirish</h1>
        <p class="sub" data-i18n="login.subtitle">Faqat vakolatli xodimlar uchun</p>

        <div id="loginError" class="alert alert-danger hidden" role="alert"></div>

        <form id="loginForm" novalidate>
          <label class="field">
            <span data-i18n="login.username">Login</span>
            <input
              id="loginUsername"
              class="input"
              type="text"
              autocomplete="username"
              required
              autocapitalize="off"
              spellcheck="false"
            />
          </label>
          <label class="field">
            <span data-i18n="login.password">Parol</span>
            <input
              id="loginPassword"
              class="input"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>
          <button
            id="loginSubmit"
            class="btn btn-primary"
            type="submit"
            style="width: 100%; margin-top: 6px"
            data-i18n="login.submit"
          >
            Kirish
          </button>
        </form>
      </div>
    </div>

    <!-- ================================================================== -->
    <!-- Application shell                                                  -->
    <!-- ================================================================== -->
    <div id="shell" class="shell hidden">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <img src="/admin/assets/brand/mark-128.png" alt="" width="32" height="32" />
          <span>Maklersiz <span class="brand-chip">Uy</span></span>
        </div>
        <nav id="sidebarNav" class="sidebar-nav" aria-label="Main"></nav>
        <div class="sidebar-footer">
          <div style="font-size: 12px">
            <div id="adminName" style="font-weight: 800"></div>
            <div id="adminRole" style="color: var(--subtle); font-size: 11px"></div>
          </div>
          <button id="logoutBtn" class="btn btn-secondary btn-sm" data-i18n="common.logout">
            Chiqish
          </button>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <button
            id="sidebarToggle"
            class="btn btn-ghost btn-icon"
            data-i18n-label="nav.overview"
            type="button"
          >
            ☰
          </button>
          <h1 id="viewTitle"></h1>
          <div class="spacer"></div>
          <select
            id="languageSelect"
            class="select"
            style="width: auto"
            data-i18n-label="common.language"
          ></select>
          <button
            id="themeBtn"
            class="btn btn-secondary btn-icon"
            data-i18n-label="common.theme"
            type="button"
          >
            ◐
          </button>
        </header>

        <main id="viewHost" class="content"></main>
      </div>
    </div>

    <div id="toasts" aria-live="polite"></div>

    <script type="module" src="/admin/assets/app.js"></script>
  </body>
</html>
